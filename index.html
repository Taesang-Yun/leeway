<style>
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f2,#0d1512);--card:light-dark(#ffffff,#16211c);--ink:light-dark(#14201b,#e8efe9);
--mute:light-dark(#5b6b63,#94a69c);--line:light-dark(#dfe6e0,#26352d);
--band:#00463c;--bandink:#f1f7f2;--lime:#d4f07a;--coral:#ff6f59}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
:lang(ko) body{word-break:keep-all}
.band{padding:clamp(20px,4vw,52px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.big{font-family:"Inter Tight","Noto Sans KR",Inter,sans-serif;letter-spacing:-.01em}
.top{background:var(--band);color:var(--bandink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--lime);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 4px;border-top:3px solid var(--band);border-bottom:3px solid var(--band)}
h1{font-size:clamp(28px,4vw,46px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 20px;opacity:.8;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:clamp(18px,3vw,44px);align-items:start}
.ctl{display:grid;gap:12px}
.f{display:grid;gap:6px;font-size:14px;font-weight:500}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.srch{display:flex;gap:6px}
input{font:inherit;font-size:16px;height:46px;border-radius:10px;border:1px solid #ffffff33;background:#ffffff14;color:var(--bandink);padding:0 12px;width:100%}
input::placeholder{color:#ffffff88}
.btn{font:600 15px Inter,"Noto Sans KR",sans-serif;border:0;border-radius:10px;min-height:46px;padding:0 14px;cursor:pointer;background:#ffffff22;color:var(--bandink);white-space:nowrap}
.btn.go{background:var(--lime);color:#0f2a22;font-size:17px;min-height:52px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:#ffffff14;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--bandink);font:500 15px Inter,"Noto Sans KR",sans-serif;cursor:pointer;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--lime);color:#0f2a22;font-weight:600}
.lang button{min-height:36px;font-size:14px;flex:none;padding:0 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.picked{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffffff14;border-radius:10px;padding:10px 12px;font-weight:600}
.picked small{font-weight:400;opacity:.7}
.picked button{background:none;border:0;color:var(--bandink);opacity:.8;cursor:pointer;font:inherit;font-size:14px;min-height:32px}
.cands{display:grid;gap:4px;margin-top:6px}
.cands button{text-align:left;background:#ffffff10;border:1px solid #ffffff22;border-radius:8px;color:var(--bandink);padding:8px 10px;font:inherit;font-size:15px;cursor:pointer}
.cands small{opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:#ffffff14;border:1px solid #ffffff2a;color:var(--bandink);border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:34px}
.hint{font-size:13px;opacity:.75;margin:0}
.lead{font-size:15px;opacity:.85;margin:0}
.big{font-size:clamp(48px,8vw,88px);font-weight:800;line-height:1;margin:4px 0 10px;white-space:nowrap}
.cmp{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;margin-bottom:18px;opacity:.88}
.cmp b{white-space:nowrap}
.strip{display:flex;height:54px;border-radius:10px;overflow:hidden;background:#ffffff10}
.strip div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;border-right:1px solid #00463c}
.strip .walk{background:repeating-linear-gradient(135deg,#ffffff30 0 6px,#ffffff18 6px 12px)}
.strip .cush{background:repeating-linear-gradient(135deg,var(--lime) 0 6px,#bfe05f 6px 12px);color:#0f2a22}
.ends{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.85}
.steps{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid #ffffff22}
.steps li{display:grid;grid-template-columns:6em minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid #ffffff18;font-size:15px}
.steps time{font-weight:600;white-space:nowrap;text-align:right}
.steps .c{color:var(--lime)}.steps small{opacity:.75}
.dot{display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;font-weight:600;font-size:13px;margin-right:6px;white-space:nowrap}
.none{background:#ffffff12;border-radius:12px;padding:20px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.opts button{background:#ffffff14;border:1px solid #ffffff2a;color:var(--bandink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.opts button[aria-pressed=true]{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.opts b{display:block;font-size:16px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{font-size:20px;margin:0 0 4px}.card>p{margin:0 0 14px;color:var(--mute);font-size:14px}
.risk{color:var(--coral);font-weight:600}.ok{color:light-dark(#1d7a4c,#8fd6a8);font-weight:600}
.list{list-style:none;margin:0;padding:0}.list li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.lv{display:flex;justify-content:space-between;gap:12px}.lv b{white-space:nowrap}.lv span:first-child{color:var(--mute)}
.lv.on span:first-child{color:var(--ink);font-weight:600}
.how{font-size:14px;color:var(--mute);max-width:80ch;margin:28px 0 0}.how b{color:var(--ink)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:var(--lime);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(1turn)}}
.resgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(16px,2.5vw,32px);align-items:start}
.why{background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:16px 18px}
.why h2{font-size:17px;margin:0 0 2px}.why .hint{margin:0 0 10px}
.why ol{list-style:none;margin:0;padding:0}
.why li{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid #ffffff18;font-size:14px;line-height:1.45}
.why time{font-weight:600;text-align:right;white-space:nowrap;opacity:.9}
.why li.fin{color:var(--lime);font-size:15px}
@media(max-width:1180px){.resgrid{grid-template-columns:minmax(0,1fr)}}
.one{font-size:18px;font-weight:600;margin:0 0 6px}.one small{display:block;font-weight:400;font-size:15px;opacity:.8;margin-top:2px}
.moreBtn{margin-top:14px;background:transparent;border:1px solid #ffffff44;color:var(--bandink);border-radius:999px;padding:8px 16px;font:500 14px Inter,"Noto Sans KR",sans-serif;cursor:pointer;min-height:40px}
body:not(.more) .more,body:not(.more) main{display:none}
@media(max-width:900px){.grid,.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.steps li{grid-template-columns:5.2em minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="top band">
<div class="wrap">
<div class="bar">
<div class="brand"><i></i>Leeway</div>
<div class="seg lang" id="lang"><button type="button" data-v="ko" lang="ko">한국어</button><button type="button" data-v="en" lang="en">English</button></div>

<div class="chips" id="favs"></div>
<div class="row2">
<div class="f"><span data-i="planby"></span><div class="seg" id="mode"><button type="button" data-v="arrive" data-i="arriveBy"></button><button type="button" data-v="leave" data-i="leaveAt"></button></div></div>
<label class="f"><span data-i="date"></span><input type="date" id="date"></label>
</div>
<label class="f"><span id="tlab"></span><input type="time" id="time"></label>
<button type="submit" class="btn go" id="go" data-i="go"></button>

</form>
<section id="res" aria-live="polite"></section>
</div>
</div>
</header>
<main class="band">
<div class="wrap">
<div class="cols">
<ul id="levels" hidden></ul>
<section class="card"><h2 data-i="cMiss"></h2><p data-i="cMissSub"></p><ul class="list" id="miss"><li>—</li></ul></section>
<section class="card"><h2 data-i="cEnds"></h2><p data-i="cEndsSub"></p><ul class="list" id="ends"><li>—</li></ul></section>
</div>
<p class="how" id="how"></p>
</div>
</main>

 if(out.length<3&&words.length>1){const last=words[words.length-1];try{await photon(last)}catch(e){}try{await nomi(last+' '+words.slice(0,-1).join(' ').replace(/카이스트/g,'대전'))}catch(e){}}

function whyHtml(why,final,backward){
 const rows=(backward?why:why).map(w=>`<li><time>${fmt(w.t)}</time><span>${w.x}</span></li>`).join('');
 return `<div class="why"><h2>${t('whyTitle')}</h2><p class="hint">${backward?t('whyBack'):t('whyFwd')}</p><ol>${rows}<li class="fin"><time>${fmt(final.t)}</time><span>${final.x}</span></li></ol></div>`;
}
const perfectCity=(path,legs)=>path.info?.totalTime||legs.reduce((a,l)=>a+l.min,0);
// ---------- intercity schedules ----------
const DOW='일월화수목금토';
function runs(rd,date){if(!rd||/매일|daily/i.test(rd))return true;const d=DOW[new Date(date+'T12:00:00+09:00').getDay()];return rd.includes(d)}
function parseSched(type,j,ride,date){
 const r=j.result||{};let out=[];
 if(type===4){for(const s of r.station||[])if(runs(s.runDay,date)){let d=hm(s.departureTime),a=hm(s.arrivalTime);if(a<d)a+=1440;out.push({dep:d,arr:a,cls:(s.trainClass||'')+(s.trainNo?' '+s.trainNo:'')})}}
 else{for(const s of r.station||[]){const w=s.wasteTime?hm(s.wasteTime):ride;for(const part of [s.schedule,s.nightSchedule])if(part)for(const x of String(part).split(',')){const m=x.match(/(\d{1,2}):(\d{2})(?:\((.+?)\))?/);if(!m)continue;const d=+m[1]*60+ +m[2];out.push({dep:d,arr:d+w,cls:(m[3]||(S.lang==='ko'?'일반':'Standard'))})}}}
 const seen=new Set();out=out.filter(o=>{const k=o.dep+'|'+o.arr;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.dep-b.dep);
 return out;
}
// access leg (origin -> station). Returns {safe, perfect, legs} using a city search when far.
async function access(a,b,lv){
 const d=km(a,b);
 if(d<0.7){const w=Math.max(2,Math.ceil(d*1000*1.3/70));return{walkOnly:true,legs:[{k:'walk',min:w}],safe:w,perfect:w}}
 const j=await api('searchPubTransPathT',{SX:a.x,SY:a.y,EX:b.x,EY:b.y},20);
 const paths=(j.result?.path||[]).slice(0,4);if(!paths.length){const w=Math.ceil(d*1000*1.3/70);return{legs:[{k:'walk',min:w}],safe:w,perfect:w}}
 let best=null;for(const p of paths){const legs=cityLegs(p);const s=cityPlan(legs,lv).dur;if(!best||s<best.safe)best={legs,safe:s,perfect:perfectCity(p,legs),path:p}}
 best.byLv=Object.fromEntries(Object.keys(LV).map(k=>[k,cityPlan(best.legs,LV[k]).dur]));
 return best;
}
// ---------- rendering helpers ----------
const lateTxt=(a,T)=>a<=T?`<span class="ok">${a===T?t('onTime'):t('early',mins(T-a))}</span>`:`<span class="risk">${t('late',mins(a-T))}</span>`;
function stripHtml(segs,start,end){
 const tot=Math.max(1,end-start);
 return `<div class="strip" role="img" aria-label="${t('sLeave',fmt(start))} → ${t('sArrive',fmt(end))}">${segs.filter(s=>s.min>0).map(s=>{const w=s.min/tot*100;
  if(s.k==='ride')return `<div style="width:${w}%;background:${s.l.color}" title="${esc(s.l.name)}">${w>9?esc(s.l.short||s.l.name):''}</div>`;
  return `<div class="${s.k==='walk'?'walk':'cush'}" style="width:${w}%">${w>7?Math.round(s.min)+'′':''}</div>`}).join('')}</div>
  <div class="ends"><span>${t('sLeave',fmt(start))}</span><span>${t('sArrive',fmt(end))}</span></div>`;
}
function stepsHtml(segs,start){
 let c=start;const rows=[];let pend=0;
 const flush=()=>{if(pend>0)rows.push(`<li><time></time><span class="c">${t('wait',mins(pend))}</span></li>`);pend=0};
 for(const s of segs){
  if(s.k==='cush'){pend+=s.min;c+=s.min;continue}flush();
  if(s.k==='walk')rows.push(`<li><time>${fmt(c)}</time><span>${esc(s.text||t('walk',mins(s.min)))}</span></li>`);
  else if(s.k==='note')rows.push(`<li><time>${s.at!=null?fmt(s.at):''}</time><span>${s.html}</span></li>`);
  else{const l=s.l;rows.push(`<li><time>${fmt(s.at??c)}</time><span><span class="dot" style="background:${l.color}">${esc(l.name)}</span>${esc(t('ride',l.from,l.to,mins(s.min)))}<br><small>${l.sched==='subway'?t('schedSub'):l.sched==='term'?t('schedTerm',fmt(clock(l.first)),l.iv):l.iv?t('every',l.iv)+(l.ivKnown===false?' · '+t('noIv'):''):''}${l.extra||''}</small></span></li>`)}
  c+=s.min;
 }
 flush();return `<ol class="steps">${rows.join('')}</ol>`;
}
function oneLine(segs,arr,arrive){
 const rides=segs.filter(x=>x.k==='ride');if(!rides.length)return '';
 const f=rides[0],names=rides.map(r=>esc(r.l.short&&r.l.name.length>14?r.l.short:r.l.name)).join(' → ');
 return `<p class="one">${names}<small>${f.at!=null?t('boardAt',fmt(f.at),esc(f.l.from)):''}${arrive?t('arriveBy2',fmt(arr)):t('arriveAt2',fmt(arr))}</small></p>`;
}
const moreBtn=()=>`<button type="button" class="moreBtn" id="moreBtn">${document.body.classList.contains('more')?t('less'):t('more')}</button>`;
document.addEventListener('click',e=>{if(e.target.id==='moreBtn'){S.more=!S.more;save();document.body.classList.toggle('more',!!S.more);e.target.textContent=S.more?t('less'):t('more')}});
const blank=(m,spin)=>{$('res').innerHTML=`<div class="none"><p class="lead">${spin?'<span class="spin"></span>':''}${m}</p></div>`};
// ---------- city ----------
async function runCity(T){
 const j=await api('searchPubTransPathT',{SX:S.from.x,SY:S.from.y,EX:S.to.x,EY:S.to.y},20);
 const paths=(j.result?.path||[]).slice(0,5);if(!paths.length)return blank(t('noRoute'));
 const lv=LV[S.lvl],arrive=S.mode==='arrive';
 const ends={start:S.from.name,end:S.to.name},plan=(legs,L)=>arrive?planBack(legs,T,L,ends):planFwd(legs,T,L,0,null,ends);
 let opts=paths.map(p=>{const legs=cityLegs(p);return{p,legs,pl:plan(legs,lv)||{leave:-1e9,arrive:1e9,segs:[],dur:0},pf:perfectCity(p,legs)}});
 opts.sort((a,b)=>arrive?b.pl.leave-a.pl.leave:a.pl.arrive-b.pl.arrive);
 // Load timetables for the two best candidates and let the real times decide, unless the person picked one.
 if(S.cityOpt==null){for(const o of opts.slice(0,2)){await attachSched(o.legs,S.date);o.pl=plan(o.legs,lv)||{leave:-1e9,arrive:1e9,segs:[],dur:0}}opts.sort((a,b)=>arrive?b.pl.leave-a.pl.leave:a.pl.arrive-b.pl.arrive)}
 const sel=opts[Math.min(S.cityOpt||0,opts.length-1)];
 await attachSched(sel.legs,S.date);
 const pl=plan(sel.legs,lv);
 const label=o=>o.legs.filter(l=>l.k!=='walk').map(l=>l.name).join(' → ');
 const optBar=`<div class="opts" id="copts">${opts.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="${o===sel}"><b>${o===sel&&pl?fmt(arrive?pl.leave:pl.arrive):fmt(arrive?o.pl.leave:o.pl.arrive)}</b>${esc(label(o))}</button>`).join('')}</div>`;
 const bindO=()=>{$('copts').onclick=e=>{const b=e.target.closest('button');if(b){S.cityOpt=+b.dataset.i;save();runCity(T)}}};
 if(!pl){$('res').innerHTML=optBar+`<div class="none"><p class="lead">${t('noService')}</p></div>`;bindO();$('levels').innerHTML=$('miss').innerHTML='<li>—</li>';cityEnds(sel.legs,lv);return}
 const perfect=arrive?T-sel.pf:T+sel.pf;
 $('res').innerHTML=`<div class="resgrid"><div><p class="lead">${arrive?t('leaveBy'):t('arriveAround')}</p><div class="big">${fmt(arrive?pl.leave:pl.arrive)}</div>
 ${oneLine(pl.segs,pl.arrive,arrive)}${moreBtn()}</div>${whyHtml(pl.why,arrive?{t:pl.leave,x:t('wFinal',fmt(pl.leave))}:{t:pl.arrive,x:t('wFinalArr',fmt(pl.arrive))},arrive)}</div>
 <div class="more" style="margin-top:18px"><div class="cmp"><span>${t('perfect')}: <b>${fmt(perfect)}</b></span><span>${t('extra')} <b>${mins(pl.dur-sel.pf)}</b></span><span>${t('d2d')} <b>${mins(pl.dur)}</b></span></div>
 ${optBar}${stripHtml(pl.segs,pl.leave,pl.arrive)}${stepsHtml(pl.segs,pl.leave)}</div>`;
 bindO();
 $('levels').innerHTML=[[t('perfect'),{leave:T-sel.pf,arrive:T+sel.pf},'']].concat(Object.keys(LV).map(k=>[t(k),plan(sel.legs,LV[k]),k])).map(([n,p,k])=>`<li class="lv${k===S.lvl?' on':''}"><span>${n}</span><b>${p?(arrive?t('lvLeave',fmt(p.leave)):t('lvArrive',fmt(p.arrive))):'—'}</b></li>`).join('');
 const goal=arrive?T:pl.arrive,rides=pl.segs.filter(x=>x.k==='ride');
 $('miss').innerHTML=rides.length?rides.map(r=>{const l=r.l,i=sel.legs.indexOf(l);
  if(r.at!=null){const f=planFwd(sel.legs,r.at,LV.relaxed,i,r.at);if(!f)return `<li>${t('missNone',esc(fmt(r.at)+' '+l.name))}</li>`;const nd=f.segs.find(x=>x.k==='ride').at;return `<li>${t('missTrain',esc(fmt(r.at)+' '+l.name),fmt(nd),lateTxt(f.arrive,goal))}</li>`}
  const a=pl.leave+sel.pf+Math.round(l.iv/2)+l.iv;return `<li>${t('missLeg',esc(l.name),l.iv,lateTxt(a,goal))}</li>`}).join(''):'<li>—</li>';
 cityEnds(sel.legs,lv);
}
function cityEnds(legs,lv){
 const sch=legs.filter(l=>l.deps);
 if(!sch.length){$('ends').innerHTML=`<li>${t('cityEnds')}</li>`;return}
 const last=planBack(legs,27*60+59,lv),f=planFwd(legs,240,lv),first=f&&planBack(legs,f.arrive,lv);
 const what=p=>p.segs.filter(x=>x.k==='ride'&&x.at!=null).map(x=>fmt(x.at)+' '+esc(x.l.name)).join(', ');
 $('ends').innerHTML=(first?`<li class="lv"><span>${t('firstLeave')}</span><b>${fmt(first.leave)}</b></li><li>${t('lastTxt',what(first),fmt(first.arrive))}</li>`:'')+
  (last?(()=>{const lf=planFwd(legs,last.leave,lv)||last;return `<li class="lv"><span>${t('lastLeave')}</span><b class="risk">${fmt(last.leave)}</b></li><li>${t('lastTxt',what(lf),fmt(lf.arrive))}</li>`})():'')+
  `<li><small>${t('cityEndsNote')}</small></li>`;
}
// ---------- intercity ----------
async function runInter(T){
 const lv=LV[S.lvl],arrive=S.mode==='arrive';
 const j=await api('searchPubTransPathT',{SX:S.from.x,SY:S.from.y,EX:S.to.x,EY:S.to.y,SearchType:1},20);
 const ps=j.result?.path||[];
 // Rank by ride time plus a rough estimate of getting to/from the station (about 4 min per km + 5), so a nearer station wins over a slightly faster train.
 const est=p=>{const q=p.subPath[0];return p.info.totalTime+5+4*km(S.from,{x:+q.startX,y:+q.startY})+5+4*km({x:+q.endX,y:+q.endY},S.to)};
 const pick=type=>ps.filter(p=>p.pathType===type&&p.subPath?.length===1).sort((a,b)=>est(a)-est(b))[0];
 const choices={train:pick(11),bus:pick(12)};
 if(!choices.train&&!choices.bus)return runCity(T);
 let which=choices[S.pick]?S.pick:(choices.train?'train':'bus');
 const path=choices[which],sp=path.subPath[0],tt=sp.trafficType;
 const st={x:+sp.startX,y:+sp.startY,name:sp.startName},en={x:+sp.endX,y:+sp.endY,name:sp.endName};
 const ep=tt===4?'trainServiceTime':tt===5?'expressServiceTime':'intercityServiceTime';
 blank(t('searching'),1);
 const [sj,A,B]=await Promise.all([api(ep,{startStationID:sp.startID,endStationID:sp.endID},24*7),access(S.from,st,lv),access(en,S.to,lv)]);
 const deps=parseSched(tt,sj,sp.sectionTime,S.date);if(!deps.length)return blank(t('noTrain'));
 const kind=tt===4?t('train'):tt===5?t('xbus'):t('ibus'),color=tt===4?'#1f4fbf':'#7a4fd0';
 const Asafe=k=>A.byLv?A.byLv[k]:A.safe,Bsafe=k=>B.byLv?B.byLv[k]:B.safe;
 const feasible=(k)=>{const L=LV[k];return deps.filter(d=>d.arr+Math.round(dBuf(L,d.arr-d.dep)*(tt===4?.5:1))+L.exit+Bsafe(k)<=T)};
 const chooseArrive=k=>{const f=feasible(k);if(!f.length)return null;return LV[k].proof&&f.length>1?f[f.length-2]:f[f.length-1]};
 const leaveFor=(d,k)=>d.dep-LV[k].st-Asafe(k);
 const arrFor=(d,k)=>{const L=LV[k];return d.arr+Math.round(dBuf(L,d.arr-d.dep)*(tt===4?.5:1))+L.exit+Bsafe(k)};
 const chooseLeave=k=>deps.find(d=>d.dep>=T+Asafe(k)+LV[k].st);
 const k=S.lvl,dep=arrive?chooseArrive(k):chooseLeave(k);
 const pfDep=arrive?deps.filter(d=>d.arr+B.perfect<=T).pop():deps.find(d=>d.dep>=T+A.perfect);
 const optBtns=`<div class="opts" id="iopts">${['train','bus'].filter(w=>choices[w]).map(w=>{const s=choices[w].subPath[0];return `<button type="button" data-w="${w}" aria-pressed="${w===which}"><b>${w==='train'?t('optTrain'):t('optBus')}</b>${esc(s.startName)} → ${esc(s.endName)}</button>`}).join('')}</div>`;
 if(!dep){$('res').innerHTML=optBtns+`<div class="none"><p class="lead">${t('noTrain')}</p></div>`;bindI(T);$('levels').innerHTML=$('miss').innerHTML='<li>—</li>';fillEnds();return}
 const leave=arrive?leaveFor(dep,k):T,end=arrive?T:arrFor(dep,k);
 const accSegs=(X,lab)=>X.walkOnly?[{k:'walk',min:X.legs[0].min,text:lab}]:cityPlan(X.legs,lv).segs;
 const ride=dep.arr-dep.dep,db=Math.round(dBuf(lv,ride)*(tt===4?.5:1));
 const L={name:dep.cls||kind,short:kind,from:st.name,to:en.name,color,iv:0,extra:''};
 const aS=accSegs(A,t('toStation',st.name)),aDur=aS.reduce((s,x)=>s+x.min,0);
 const preWait=dep.dep-leave-aDur;
 const bS=accSegs(B,t('fromStation',en.name)),bDur=bS.reduce((s,x)=>s+x.min,0);
 const segs=[...aS,{k:'note',min:0,at:leave+aDur,html:esc(t('atStation',st.name,mins(preWait)))},{k:'cush',min:preWait},{k:'ride',min:ride,l:L,at:dep.dep},...(db+lv.exit?[{k:'note',min:0,at:dep.arr,html:esc(t('exitStation',mins(db+lv.exit)))},{k:'cush',min:db+lv.exit}]:[]),...bS];
 const used2=aDur+preWait+ride+db+lv.exit+bDur;if(end-leave>used2)segs.push({k:'cush',min:end-leave-used2});
 const As=Asafe(k),Bs=Bsafe(k),nextAlt=deps.filter(d=>d.dep>dep.dep).sort((a,b)=>a.arr-b.arr)[0];
 const accTxt=(X,a,b,n)=>X.walkOnly?t('wWalk',esc(a),esc(b),mins(n)):t('wAccess',esc(a),esc(b),mins(n));
 const why=arrive?[{t:T,x:t('wGoal',fmt(T),esc(S.to.name))},{t:T-Bs,x:accTxt(B,en.name,S.to.name,Bs)},{t:T-Bs-db-lv.exit,x:t('wExit',esc(en.name),mins(lv.exit),mins(db))},
  {t:dep.dep,x:t('wTrain',esc(dep.cls||kind),fmt(dep.dep),fmt(dep.arr),nextAlt?fmt(nextAlt.dep):null,nextAlt?fmt(nextAlt.arr):null)},{t:dep.dep-lv.st,x:t('wStation',esc(st.name),mins(lv.st))},{t:leave,x:accTxt(A,S.from.name,st.name,As)}]
 :[{t:T,x:t('wStart',fmt(T),esc(S.from.name))},{t:T+As,x:accTxt(A,S.from.name,st.name,As)},{t:T+As+lv.st,x:t('wStation',esc(st.name),mins(lv.st))},{t:dep.dep,x:t('wTrainF',esc(dep.cls||kind),fmt(dep.dep),fmt(dep.arr))},{t:dep.arr+db+lv.exit,x:t('wExit',esc(en.name),mins(lv.exit),mins(db))},{t:end,x:accTxt(B,en.name,S.to.name,Bs)}];
 $('res').innerHTML=`<div class="resgrid"><div><p class="lead">${arrive?t('leaveBy'):t('arriveAround')}</p><div class="big">${fmt(arrive?leave:end)}</div>
 ${oneLine(segs,end,arrive)}${moreBtn()}</div>${whyHtml(why,arrive?{t:leave,x:t('wFinal',fmt(leave))}:{t:end,x:t('wFinalArr',fmt(end))},arrive)}</div><div class="more" style="margin-top:18px">${optBtns}<div class="cmp"><span>${t('perfect')}: <b>${pfDep?fmt(arrive?pfDep.dep-A.perfect:pfDep.arr+B.perfect):'—'}</b></span>${arrive&&pfDep?`<span>${t('extra')} <b>${mins(pfDep.dep-A.perfect-leave)}</b></span>`:''}<span>${t('d2d')} <b>${mins(end-leave)}</b></span></div>
 ${stripHtml(segs.filter(s=>s.k!=='note'),leave,end)}${stepsHtml(segs,leave)}
 <p class="hint" style="margin-top:14px">${t('nextDeps')}: ${deps.filter(d=>Math.abs(d.dep-dep.dep)<=120&&d!==dep).slice(0,6).map(d=>`${esc(d.cls)} ${fmt(d.dep)}→${fmt(d.arr)}`).join(' · ')}</p></div>`;
 bindI(T);
 $('levels').innerHTML=[[t('perfect'),pfDep,'']].concat(Object.keys(LV).map(x=>[t(x),arrive?chooseArrive(x):chooseLeave(x),x])).map(([n,d,x])=>{let v='—';if(d){if(x==='')v=arrive?t('lvLeave',fmt(d.dep-A.perfect)):t('lvArrive',fmt(d.arr+B.perfect));else v=arrive?t('lvLeave',fmt(leaveFor(d,x))):t('lvArrive',fmt(arrFor(d,x)))}return `<li class="lv${x===S.lvl?' on':''}"><span>${n}</span><b>${v}</b></li>`}).join('');
 const nxt=deps.filter(d=>d.dep>dep.dep).sort((a,b)=>a.arr-b.arr)[0];const nm=`${fmt(dep.dep)} ${kind}`;
 $('miss').innerHTML=`<li>${nxt?t('missTrain',esc(nm),fmt(nxt.dep),lateTxt(arrFor(nxt,k),arrive?T:end)):t('missNone',esc(nm))}</li>`+(A.walkOnly?'':A.legs.filter(l=>l.k!=='walk').map(l=>`<li>${t('missLeg',esc(l.name),l.iv,preWait>=l.iv?`<span class="ok">${t('onTime')}</span>`:`<span class="risk">${t('late',mins(l.iv-preWait))}</span>`)}</li>`).join(''));
 fillEnds();
 function fillEnds(){const f=deps[0],l=deps[deps.length-1];$('ends').innerHTML=`<li class="lv"><span>${t('firstLeave')}</span><b>${fmt(leaveFor(f,k))}</b></li><li>${t('lastTxt',esc(kind+' '+f.cls+' '+fmt(f.dep)),fmt(arrFor(f,k)))}</li><li class="lv"><span>${t('lastLeave')}</span><b class="risk">${fmt(leaveFor(l,k))}</b></li><li>${t('lastTxt',esc(kind+' '+l.cls+' '+fmt(l.dep)),fmt(arrFor(l,k)))}</li>`}
}
function bindI(T){const o=$('iopts');if(o)o.onclick=e=>{const b=e.target.closest('button');if(b){S.pick=b.dataset.w;save();run()}}}
// ---------- main ----------
let busy=false;
async function run(){
 if(!S.from||!S.to)return blank(t('pickBoth'));
 if(busy)return;busy=true;$('go').disabled=true;blank(t('searching'),1);
 const T0=hm(S.time),T=T0<180&&S.mode==='arrive'?T0+1440:T0;
 try{if(km(S.from,S.to)>35)await runInter(T);else await runCity(T)}
 catch(e){console.error(e);blank(esc(e.message||String(e)))}
 finally{busy=false;$('go').disabled=false}
}
function applyLang(){
 document.documentElement.lang=S.lang;
 for(const e of document.querySelectorAll('[data-i]'))e.textContent=t(e.dataset.i);
 $('tlab').textContent=S.mode==='arrive'?t('arriveLab'):t('leaveLab');$('how').innerHTML=t('how');
 for(const g of ['mode','lang'])for(const x of document.querySelectorAll('#'+g+' button'))x.setAttribute('aria-pressed',x.dataset.v===S[g]);
 placeBox('from');placeBox('to');renderFavs();showQuota();
}
for(const w of ['from','to'])$(w+'Box').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='find')find(w);else if(a==='pick'){S[w]=cands[w][+b.dataset.i];cands[w]=null;save();placeBox(w)}
 else if(a==='clr'){S[w]=null;save();placeBox(w);$(w+'Q')?.focus()}
 else if(a==='fav'){const p=S[w];if(!S.favs.some(f=>f.name===p.name&&f.city===p.city)){S.favs.push(p);S.favs=S.favs.slice(-8);save();renderFavs()}}});
for(const w of ['from','to'])$(w+'Box').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id===w+'Q'){e.preventDefault();find(w)}});
$('favs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const f=S.favs[+b.dataset.i];if(!S.from)S.from=f;else S.to=f;save();placeBox('from');placeBox('to')});
$('favs').addEventListener('contextmenu',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();S.favs.splice(+b.dataset.i,1);save();renderFavs()});
for(const g of ['mode','lang'])$(g).addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;S[g]=x.dataset.v;save();applyLang();if(g!=='lang'&&$('res').querySelector('.big'))run()});
$('time').addEventListener('change',e=>{if(e.target.value){S.time=e.target.value;save()}});
$('date').addEventListener('change',e=>{if(e.target.value){S.date=e.target.value;save()}});
$('f').addEventListener('submit',e=>{e.preventDefault();S.cityOpt=null;run()});
$('time').value=S.time;$('date').value=S.date;document.body.classList.toggle('more',!!S.more);
applyLang();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
